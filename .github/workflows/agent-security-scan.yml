name: "AI Agent Security & Threat Surface Scan"

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "prompts/**"
      - "tools/**"
      - "mcp.json"
      - "agent_configs/**"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  agent-security-audit:
    name: "Audit Agent Boundaries & Guardrails"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Adversarial Security Probes
        run: |
          python test_agent_security.py --suite 03_ADVERSARIAL_ATTACK_TEST_BATTERY.json --output audit_results.json

      - name: Upload Security Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-audit-report
          path: audit_results.json

      - name: Post PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('audit_results.json')) {
              const report = JSON.parse(fs.readFileSync('audit_results.json', 'utf8'));
              const badge = report.score >= 90 ? '🟢 PASSED' : '🔴 VULNERABILITIES DETECTED';
              const body = `### 🛡️ AI Agent Security & MITRE ATLAS Audit Result: ${badge}\n\n` +
                           `* **Security Health Score:** \`${report.score} / 100\`\n` +
                           `* **Probes Tested:** ${report.total_probes}\n` +
                           `* **Passed:** ${report.passed} | **Failed:** ${report.failed}\n\n` +
                           `*Framework Mapping: OWASP LLM Top 10 | MITRE ATLAS | ISO/IEC 42001*\n`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
