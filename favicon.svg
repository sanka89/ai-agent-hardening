<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline with Gradient -->
  <path d="M16 2 L29 7.5 V15.5 C29 23.5 16 30.5 16 30.5 C16 30.5 3 23.5 3 15.5 V7.5 Z" 
        fill="url(#coreGrad)" stroke="url(#shieldGrad)" stroke-width="2" stroke-linejoin="round" />

  <!-- Inner Cyber Node Network -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round">
    <line x1="16" y1="13" x2="16" y2="21" />
    <line x1="16" y1="13" x2="10.5" y2="17" />
    <line x1="16" y1="13" x2="21.5" y2="17" />
  </g>

  <!-- Central Glowing AI Core Node -->
  <circle cx="16" cy="13" r="3.2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="16" cy="13" r="1.5" fill="#ffffff" />

  <!-- Surrounding Satellite Nodes -->
  <circle cx="16" cy="21" r="1.6" fill="#818cf8" />
  <circle cx="10.5" cy="17" r="1.6" fill="#818cf8" />
  <circle cx="21.5" cy="17" r="1.6" fill="#818cf8" />
</svg>